    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;

          background: #1a1816;
        }
        body {
          overscroll-behavior: none;
        }
      }
      metronome-app:not(:defined) {
        display: none;
      }
