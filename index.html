<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Metronome FS-1: a vintage drum-machine style metronome with tap tempo and selectable beats per bar." />
    <meta name="theme-color" content="#24211d" />
    <title>Metronome FS-1</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ff2a14'/%3E%3C/svg%3E" />
    <!-- Installable app: manifest for Android/Chrome, meta tags and touch icon for iOS home screens -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Metronome" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    
    <script>
      // On its own (not embedded in another page) the page gets a solid backdrop; embedded, it
      // stays transparent so the host page shows around the device.
      if (window.self === window.top) document.documentElement.classList.add('solo');
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        /* Keep clear of notches, rounded corners and the home indicator. */
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
        background: transparent;
      }
      /* Short screens (phones held sideways): every pixel of height counts. */
      @media (max-height: 460px) {
        body {
          padding-top: max(8px, env(safe-area-inset-top));
          padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
      }
      /* Installed as an app there is no host page behind it, so give it a dark backdrop. */
      @media (display-mode: standalone) {
        html {
          background: #24211d;
        }
        body {
          overscroll-behavior: none;
        }
      }
      /*
       * On its own page the device sits on a solid warm charcoal, a little lighter than the panel
       * so the case's drop shadow still reads, and matching the theme colour.
       */
      html.solo {
        min-height: 100%;
        background: #24211d;
      }
      metronome-app:not(:defined) {
        display: none;
      }
    </style>

      box-shadow:
        0 0 0 2px #121211,
        0 0 16px 6px rgba(50, 230, 90, 0.5),
        0 0 40px 10px rgba(50, 230, 90, 0.2);
    }

    /* Plastic keycaps seated in dark panel cut-outs */
    /* Fast repeated taps (tap tempo) must not zoom the page or open the iOS callout. */
    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }
    /* 808-style keys: flat matte caps, nearly square corners, a low front lip and a tight dark gap */
    .key {
      --cap-top: #f6f1e4;
      --cap-mid: #e9e3d1;
      --cap-low: #bdb59f;
      position: relative;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      background:
        var(--grain),
        linear-gradient(
          180deg,
          var(--cap-top) 0,
          var(--cap-mid) 5px,
          var(--cap-mid) calc(100% - 9px),
          var(--cap-low) calc(100% - 8px)
        );
      background-size: 120px 120px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 1px 0 0 rgba(255, 255, 255, 0.12),
        inset -1px 0 0 rgba(0, 0, 0, 0.12),
        0 0 0 1.5px #0b0b0a,
        0 0 0 2.5px rgba(255, 255, 255, 0.04),
        0 4px 5px rgba(0, 0, 0, 0.6);
      transition:
        transform 0.05s,
        box-shadow 0.05s;
    }
    .key:active {
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 0 0 1.5px #0b0b0a,
        0 0 0 2.5px rgba(255, 255, 255, 0.04),
        0 1px 2px rgba(0, 0, 0, 0.6);
    }
    .key > .key-led {
      position: absolute;
      top: 9px;
      left: 50%;
      margin-left: -5px;
      z-index: 1;
    }
    /*
     * Small indicator LEDs, on the keys (.key-led) and on the panel (.panel-led: by the mode names
     * and under the value keys): red by default (also beats per bar), blue for clicks per beat,
     * green for the beat being played.
     */
    .key-led,
    .panel-led {
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #6e2016, #360b06);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.35),
        0 1px 0 1.5px rgba(255, 255, 255, 0.35);
    }
    /* On the dark panel the LEDs get a darker ring and a fainter highlight than on the keys. */
    .panel-led {
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.6),
        0 1px 0 1.5px rgba(255, 255, 255, 0.12);
    }
    .key-led.blue,
    .panel-led.blue {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #1c3a72, #0a1838);
    }
    .panel-led.green {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.4) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #1f5a26, #0b2a10);
    }
    .key-led.on,
    .panel-led.on {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #ffb39f, #ff3a1c 55%, #c01a06);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.3),
        0 0 7px 3px rgba(255, 58, 28, 0.6);
    }
    .panel-led.green.on {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #c8ffcf, #45f06a 55%, #0f9c2c);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.5),
        0 0 7px 3px rgba(50, 230, 90, 0.55);
    }
    .key-led.blue.on,
    .panel-led.blue.on {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #bcd8ff, #3d8bff 55%, #1250c4);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.3),
        0 0 7px 3px rgba(60, 140, 255, 0.6);
    }
    .tap {
      --cap-top: #bdbab2;
      --cap-mid: #a19e96;
      --cap-low: #84817a;
      /*
       * The display's frame is drawn 5px outside its box, the key's outline only 1.5px; stretch the
       * key 3.5px past its grid row on both sides so their outer edges line up.
       */
      margin-block: -3.5px;
    }

    /* Bottom section: start/stop sits in the first column of the same grid as the beat buttons. */
    .sequencer {
      display: grid;
      grid-template-columns: calc(var(--start-width) + 0.8rem) repeat(8, minmax(0, 1fr));
      gap: 0.55rem 0.6rem;
      padding: 1.4rem 2.4rem 1.6rem;
      border-top: 1px solid rgba(0, 0, 0, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.2));
    }
    .modes {
      grid-area: 1 / 2 / 2 / -1;
      align-self: end;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem 1.8rem;
    }
    /* The mode names are buttons too (switch to that mode), but look like plain panel print. */
    .mode-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.2rem 0;
      border: none;
      background: none;
      cursor: pointer;
    }
    .mode-option:focus-visible {
      outline-offset: 3px;
    }
    /* "Start" above the key and "Stop" below it, each as wide as the key so it's centred on it. */
    .start-label {
      grid-column: 1;
      justify-self: start;
      width: var(--start-width);
    }
    .start-label.above {
      grid-row: 1;
      align-self: end;
    }
    .start-label.below {
      grid-row: 3;
    }
    .start,
    .step {
      height: 60px;
    }
    .start {
      grid-area: 2 / 1;
      width: var(--start-width);
    }
    .beat-buttons {
      display: contents;
    }
    /* Grid positions come from per-key variables so the mobile layout can rearrange them. */
    .step {
      grid-area: 2 / var(--col);
    }
    /* Row under the keys: a green beat LED under each value key, the "Mode" label under the mode key. */
    .num {
      grid-area: 3 / var(--col);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /*
     * Number moulded into the cap, below the key LED and above the front lip: a darker shade of the
     * cap colour, with a light lower edge and a faint dark upper edge so it reads as recessed.
     */
    .cap-num {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 11px;
      font-family: 'DIN Alternate', 'DIN Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      font-stretch: condensed;
      letter-spacing: 0.04em;
      line-height: 1;
      text-align: center;
      color: rgba(120, 86, 6, 0.75);
      text-shadow:
        0 1px 0 rgba(255, 246, 205, 0.6),
        0 -1px 0 rgba(70, 48, 0, 0.18);
      pointer-events: none;
    }
    /* 808-style cap colours: yellow value keys, a red mode key */
    .step {
      --cap-top: #f9d867;
      --cap-mid: #f2c12e;
      --cap-low: #ba9017;
    }
    .step.mode {
      --cap-top: #f0614a;
      --cap-mid: #e2432c;
      --cap-low: #a82b1b;
    }

    footer {
      padding: 0.7rem 2.4rem 0.8rem;
      font-size: 0.68rem;
      text-align: center;
      color: rgba(232, 225, 204, 0.45);
      border-top: 1px solid rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    /*
     * Tip button between the name and the badge: a key like the others, but with a cap of brushed
     * aluminium, so it looks machined from the strip it sits in; the cup and lettering are etched
     * like the logo.
     */
    .tip-button {
      display: flex;
      flex: none;
      align-items: center;
      gap: 0.45rem;
      /* As tall as the badge */
      height: calc(0.68 * 1.39 * var(--brand-size) + 0.22rem);
      padding: 0 0.85rem 0 0.7rem;
      box-sizing: border-box;
      white-space: nowrap;
      font-family: var(--label-font, 'Helvetica Neue', Helvetica, Arial, sans-serif);
      font-size: 0.62rem;
      font-style: normal;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(34, 32, 27, 0.85);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      border-radius: 5px;
      background:
        var(--brushed),
        linear-gradient(180deg, #f6f6f1 0%%, #d6d6d0 48%%, #c0c0ba 52%%, #b2b2ac 100%%);
      background-size: 300px 60px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 3px 4px rgba(0, 0, 0, 0.45);
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.05s,
        box-shadow 0.05s,
        filter 0.15s;
    }
    .tip-button:hover {
      filter: brightness(1.06);
    }
    .tip-button:active {
      transform: translateY(1.5px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .tip-button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }
    .tip-icon {
      flex: none;
      width: 1.5em;
      height: 1.5em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0.8px 0 rgba(255, 255, 255, 0.65));
    }
    /* Narrow screens: no room in the strip, so the tip moves to the line under the device */
    @media (max-width: ${He-1}px) {
      .tip-button {
        display: none;
      }
    }
    @media (min-width: ${He}px) {
      .tip {
        display: none;
      }
    }
    /*
     * Tip line under the device. The page behind it may be light (normal browser tab) or dark
     * (installed app), so it uses a mid-tone that reads on both.
     */
    .tip {
      margin: 1.1rem 0 0;
      font-size: 0.78rem;
      line-height: 1.5;
      text-align: center;
      color: #8c8577;
    }
    /* Where the full sentence would wrap, fitTip() switches to just the link. */
    .tip-short,
    .tip.short .tip-long {
      display: none;
    }
    .tip.short .tip-short {
      display: inline;
    }
    .tip a {
      color: #e0533d;
      font-weight: 700;
      text-decoration: none;
      border-radius: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    .tip a:hover {
      text-decoration: underline;
    }
    .tip a:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
    }
    kbd {
      font: inherit;
      font-weight: 700;
      padding: 0 0.3em;
      border: 1px solid rgba(232, 225, 204, 0.35);
      border-radius: 3px;
    }

    /*
     * Phone layout, in portrait only: a phone held sideways is wide enough for the desktop layout,
     * which needs far less height (one row of keys).
     */
    @media (max-width: 720px) and (orientation: portrait) {
      .cheek {
        flex-basis: 12px;
      }
      header {
        padding: 0.9rem 2.2rem 0.75rem 1.6rem;
      }
      /*
       * Start/stop key spanning both rows of beat keys, narrow enough that the beat LED column
       * above it leaves room for the display and tap key.
       */
      :host {
        --key-height: 46px;
        --num-height: 16px;
        --row-gap: 0.45rem;
        --start-width: 84px;
      }
      /*
       * Same row, on the phone sequencer's grid (four keys per row): the display still starts at
       * key 1, and the tap key is one key column wide, above the mode key. The digits shrink with
       * the screen so the display always fits.
       */
      /*
       * The knob keeps the desktop proportion to the tap key's height (96 to 111px) where the row
       * has room, and shrinks with the screen on narrow phones so the display keeps its digits.
       */
      .controls {
        --panel-height: 84px;
        --knob-size: clamp(46px, calc(24vw - 40px), calc((var(--panel-height) + 7px) * 96 / 111));
        --digit-size: clamp(1.8rem, 7.5vw, 3.4rem);
        --start-col: calc(var(--start-width) + 0.4rem);
        --seq-gap: 0.35rem;
        --key-col: calc((100% - var(--start-col) - 4 * var(--seq-gap)) / 4);
        --tap-col: var(--key-col);
        grid-template-columns:
          var(--start-col) minmax(0, 1fr) calc(var(--knob-size) + 0.5rem)
          var(--tap-col);
        row-gap: 0.6rem;
        padding: 1.25rem 1rem;
      }
      /* No room for the usage hint beside the beat and tap labels; touch users find the gestures. */
      .controls .display-label {
        visibility: hidden;
      }
      .bezel {
        width: 44px;
        height: 44px;
      }
      .led {
        width: 28px;
        height: 28px;
      }
      .led::after {
        top: 4px;
        left: 6px;
        width: 10px;
        height: 7px;
      }
      /* Beat keys in two rows of four, each with its numbers below. */
      .sequencer {
        grid-template-columns: calc(var(--start-width) + 0.4rem) repeat(4, minmax(0, 1fr));
        grid-template-rows: auto var(--key-height) var(--num-height) var(--key-height) var(--num-height);
        gap: var(--row-gap) 0.35rem;
        padding: 1.25rem 1rem;
      }
      .start-label.below {
        grid-row: 5;
      }
      .start {
        grid-area: 2 / 1 / 5 / 2;
        height: auto;
      }
      .step {
        grid-area: var(--m-row) / var(--m-col);
        height: auto;
      }
      .num {
        grid-area: var(--m-num-row) / var(--m-col);
      }
      /* Shorter keys: a slightly smaller number so it stays clear of the key LED. */
      .cap-num {
        bottom: 9px;
        font-size: 1rem;
      }
      /* Keyboard hints are no use on touch screens; keep the strip for the screws. */
      footer {
        padding: 0;
        height: 30px;
      }
      .hints {
        display: none;
      }
    }

    /*
     * Small phones: a slimmer start/stop key (and so beat LED column) leaves more room for the
     * display; the display sizes its digits to whatever width it gets.
     */
    @media (max-width: 400px) {
      :host {
        --start-width: 64px;
      }
    }

    /*
     * Short screens (phones held sideways): tighter spacing and shorter keys. fit() scales the
     * device down if it still doesn't fit the screen height.
     */
    @media (max-height: 460px) {
      header {
        padding: 0.5rem 2.4rem 0.45rem;
      }
      header {
        --brand-size: 1.4rem;
      }
      .controls {
        --panel-height: 84px;
        --knob-size: 78px;
        row-gap: 0.5rem;
        padding: 1rem 2.4rem 0.8rem;
      }
      .sequencer {
        row-gap: 0.4rem;
        padding: 0.7rem 2.4rem 0.8rem;
      }
      .start,
      .step {
        height: 48px;
      }
      .cap-num {
        bottom: 9px;
        font-size: 1rem;
      }
      footer {
        padding: 0;
        height: 22px;
      }
      .hints {
        display: none;
      }
      .tip {
        margin-top: 0.5rem;
      }
    }
